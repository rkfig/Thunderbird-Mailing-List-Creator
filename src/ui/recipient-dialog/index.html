<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mailing List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Mailing List</h1>
      <p>Create a mailing list from the selected message recipients.</p>
      <section>
        <label for="listName">Mailing List Name</label>
        <input id="listName" type="text" maxlength="120" autocomplete="off" />
      </section>
      <section>
        <p id="recipientSummary" class="summary" aria-live="polite">Loading recipients...</p>
        <div id="recipientContainer" class="recipient-container" aria-live="polite"></div>
      </section>
      <div class="actions">
        <button id="createButton" type="button">Create Mailing List</button>
        <button id="cancelButton" type="button">Cancel</button>
      </div>
      <p id="statusMessage" class="status" aria-live="assertive"></p>
    </main>
    <script src="index.js"></script>
  </body>
</html>
