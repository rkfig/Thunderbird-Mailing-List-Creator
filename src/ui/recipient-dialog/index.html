<!doctype html>
<html lang="en">
  <head>
    <!--
      Add-on: Mailing List Creator
      Repository: https://github.com/rkfig/Thunderbird-Mailing-List-Creator.git
      File: src/ui/recipient-dialog/index.html
      Manifest Version: 2
      Header Data Scope: Incoming message recipient review and selection UI
      Permission Basis: messagesRead (background), addressBooks
      Compose Permission Note: compose is not required for this incoming-header workflow
      Purpose: Collect list name and recipient selections for list creation.
      Author: Ryan Figgins
        Author Email Address: 14152271+rkfig@users.noreply.github.com
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mailing List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Mailing List</h1>
      <p>Create a mailing list from the selected message recipients.</p>
      <section>
        <label for="addressBookSelect">Address Book</label>
        <select id="addressBookSelect"></select>
      </section>
      <section>
        <label for="listName">Mailing List Name</label>
        <input
          id="listName"
          type="text"
          maxlength="120"
          autocomplete="off"
          placeholder="Enter Name Here"
        />
      </section>
      <section>
        <p id="recipientSummary" class="summary" aria-live="polite">Loading recipients...</p>
        <div id="recipientContainer" class="recipient-container" aria-live="polite"></div>
      </section>
      <div class="actions">
        <button id="createButton" type="button">Create Mailing List</button>
        <button id="cancelButton" type="button">Cancel</button>
      </div>
      <p id="statusMessage" class="status" aria-live="assertive"></p>
    </main>
    <script src="index.js"></script>
  </body>
</html>
